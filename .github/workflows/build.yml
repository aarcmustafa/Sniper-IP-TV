name: Build STTITEN IP TV for Android TV

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.9

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Rename APK
      run: |
        mkdir -p output
        cp app/build/outputs/apk/debug/app-debug.apk output/STTITEN-IP-TV-v1.0.0-tv.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: STTITEN-IP-TV-Android-TV
        path: output/STTITEN-IP-TV-v1.0.0-tv.apk
